<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Mês</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1b1b1a;--mut:#8a8a85;--line:#ececE8;--ok:#1f9d63;--bad:#e5484d;--acc:#1b1b1a;--accfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1c1c1b;--tx:#f2f2ef;--mut:#8f8f8a;--line:#2a2a28;--ok:#3ccf8e;--bad:#ff6b70;--acc:#f2f2ef;--accfg:#121212}}
:root[data-theme="dark"]{--bg:#121212;--card:#1c1c1b;--tx:#f2f2ef;--mut:#8f8f8a;--line:#2a2a28;--ok:#3ccf8e;--bad:#ff6b70;--acc:#f2f2ef;--accfg:#121212}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 20px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.top button{background:none;border:0;color:var(--tx);font-size:22px;padding:8px 12px;cursor:pointer}
.top h1{font-size:17px;font-weight:600;margin:0;text-transform:capitalize}
.hero{text-align:center;padding:12px 0 24px}
.hero small{color:var(--mut);font-size:13px}
.hero .big{font-size:42px;font-weight:700;letter-spacing:-1px;margin:4px 0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card small{color:var(--mut);font-size:12px;display:block}
.card b{font-size:19px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--tx);border-radius:8px;transition:width .3s}
h2{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 10px}
.cat{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 0}
.cat span:first-child{width:96px}.cat .bar{flex:1;margin:0;height:6px}.cat span:last-child{width:84px;text-align:right;color:var(--mut)}
.item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item div small{color:var(--mut);font-size:12px;display:block}
.item .v{font-weight:600;display:flex;align-items:center;gap:10px}
.item .x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:4px}
.empty{color:var(--mut);text-align:center;padding:24px 0;font-size:14px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--accfg);font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;color:var(--mut);padding:10px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
#amt{font-size:28px;font-weight:700;text-align:center}
.save{width:100%;border:0;background:var(--acc);color:var(--accfg);padding:15px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<main>
  <div class="top"><button id="prev" aria-label="Mês anterior">‹</button><h1 id="mlabel"></h1><button id="next" aria-label="Próximo mês">›</button></div>
  <div class="hero"><small>Sobra do mês</small><div class="big" id="left">R$ 0,00</div></div>
  <div class="row2">
    <div class="card"><small>Receitas</small><b class="pos" id="inc">R$ 0,00</b></div>
    <div class="card"><small>Gastos</small><b class="neg" id="exp">R$ 0,00</b></div>
  </div>
  <div class="card"><small id="pct">0% da renda usada</small><div class="bar"><i id="fill" style="width:0"></i></div></div>
  <h2>Por categoria</h2><div id="cats"></div>
  <h2>Movimentações</h2><div id="list"></div>
</main>
<button class="fab" id="open" aria-label="Adicionar">+</button>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="seg"><button id="tE" class="on">Gasto</button><button id="tI">Receita</button></div>
    <input id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off">
    <input id="desc" placeholder="Descrição (opcional)" autocomplete="off">
    <select id="cat"></select>
    <button class="save" id="save">Salvar</button>
  </div>
</div>

<script>
const CATS=["Moradia","Alimentação","Transporte","Lazer","Saúde","Outros"];
const $=id=>document.getElementById(id);
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let tx=[],type="e",d=new Date();d.setDate(1);
try{tx=JSON.parse(localStorage.getItem("mm_tx")||"[]")}catch(e){tx=[]}
const persist=()=>{try{localStorage.setItem("mm_tx",JSON.stringify(tx))}catch(e){}};
const key=()=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
$("cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");

function render(){
  $("mlabel").textContent=d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const m=tx.filter(t=>t.date.startsWith(key())).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const inc=m.filter(t=>t.type==="i").reduce((s,t)=>s+t.amt,0);
  const exp=m.filter(t=>t.type==="e").reduce((s,t)=>s+t.amt,0);
  const left=inc-exp;
  $("inc").textContent=brl(inc);$("exp").textContent=brl(exp);
  $("left").textContent=brl(left);$("left").className="big "+(left<0?"neg":"pos");
  const p=inc>0?Math.min(100,exp/inc*100):(exp>0?100:0);
  $("fill").style.width=p+"%";$("fill").style.background=p>=100?"var(--bad)":"var(--tx)";
  $("pct").textContent=Math.round(inc>0?exp/inc*100:0)+"% da renda usada";
  const by={};m.filter(t=>t.type==="e").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $("cats").innerHTML=rows.length?rows.map(([c,v])=>`<div class="cat"><span>${c}</span><div class="bar"><i style="width:${v/exp*100}%"></i></div><span>${brl(v)}</span></div>`).join(""):'<div class="empty">Sem gastos neste mês</div>';
  $("list").innerHTML=m.length?m.map(t=>`<div class="item"><div>${t.desc||t.cat}<small>${t.cat} · ${t.date.slice(8)}/${t.date.slice(5,7)}</small></div><div class="v ${t.type==="i"?"pos":""}">${t.type==="i"?"+":"−"}${brl(t.amt)}<button class="x" data-id="${t.id}" aria-label="Apagar">×</button></div></div>`).join(""):'<div class="empty">Toque em + para começar</div>';
}
function setType(t){type=t;$("tE").classList.toggle("on",t==="e");$("tI").classList.toggle("on",t==="i");$("cat").style.display=t==="e"?"block":"none"}
$("tE").onclick=()=>setType("e");$("tI").onclick=()=>setType("i");
$("open").onclick=()=>{$("sheet").classList.add("on");$("amt").value="";$("desc").value="";setType("e");setTimeout(()=>$("amt").focus(),50)};
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("on")};
$("save").onclick=()=>{
  const v=parseFloat($("amt").value.replace(/\./g,"").replace(",","."));
  if(!(v>0)){$("amt").focus();return}
  const now=new Date(),inView=key()===now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const day=inView?now.getDate():1;
  tx.push({id:Date.now(),type,amt:v,desc:$("desc").value.trim(),cat:type==="i"?"Receita":$("cat").value,date:key()+"-"+String(day).padStart(2,"0")});
  persist();$("sheet").classList.remove("on");render();
};
$("list").onclick=e=>{const id=e.target.dataset&&e.target.dataset.id;if(id&&confirm("Apagar esta movimentação?")){tx=tx.filter(t=>t.id!=id);persist();render()}};
$("prev").onclick=()=>{d.setMonth(d.getMonth()-1);render()};
$("next").onclick=()=>{d.setMonth(d.getMonth()+1);render()};
render();
</script>
</body>
</html>
